# Logarithm-only verification targets and pinned dependencies.
name = "logarithm_extension"
version = "0.1.0"
defaultTargets = ["LogarithmExtension.Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "LogarithmExtension"

[[lean_lib]]
name = "OAI"
srcDir = "vendor/openai-math/lean"
roots = ["OAI.NumberTheory.PiExponent.Main"]
globs = ["OAI.NumberTheory.PiExponent.+"]
